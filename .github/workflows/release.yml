name: release

# Build the 10.9-compatible docker toolchain (CLI + Compose + Machine) on macos-26, build the
# boot2docker.iso on Linux, build the Sparkle updater, assemble + sign the product .pkg, and attach
# the .pkg + signed appcast to a GitHub Release on v* tags.
#
# Ships a FULL release on each v* tag -- no manual prerelease/promotion dance. CI proves the build +
# gates pass; a modern runner can't boot-proof the iso, so the boot-proof auto-skips (ctest code 77)
# and Sparkle surfaces any real-10.9 breakage. boot2docker updates flow the normal Renovate way: the
# bump PR runs the CI-possible iso gates (fetch-verify + fingerprint; see boot2docker.yml) and
# automerges if they pass -- a stale fingerprint golden fails that gate until it's re-baselined.

on:
  push:
    branches: [main]        # signal: build+gate every main push (surfaces a bump that broke something)
    tags: ['*-mavericks.*']  # tags additionally package, sign, and publish a release
  pull_request:
    branches: [main]          # PR build is the status check Renovate automerge waits on
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut+publish a -mavericks.(N+1) repackage (same date, rebuilt with current ingredients)"
        type: boolean
        default: false

permissions:
  contents: write

# Superseded runs cancel on the same ref: a PR's new commit cancels its prior run, and rapid main
# merges cancel superseded main builds. Each tag is a unique ref, so a publish build is never cancelled.
# workflow_dispatch runs (local_release) get their own group-per-run-id: they land on the SAME ref as
# ordinary main pushes (refs/heads/main), and must never cancel -- or be cancelled by -- those builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-26
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a local_release repackage counts existing <upstream>-mavericks.* tags

      # shared-cmake installs itself via its own action (self-registering in the CMake user package
      # registry); consumed thereafter via find_package. @v1 is the moving major tag (Renovate tracks it).
      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      # The ingredient pin list is derived from repackage-on-ingredient-bump.yml's own paths, so the
      # repackage trigger and the release notes can't drift -- but a glob that matches nothing would
      # silently mean no repackage and thinner notes. Fail here instead.
      - name: Guard the ingredient pin declaration
        run: |
          SCR="$(cat "$HOME/.cmake/packages/MavericksSharedCMake/"* | head -1)/scripts"
          sh "$SCR/check-ingredient-pins.sh"

      # Three ways in here decide two things: what VER is, and whether this run publishes.
      #   - a *-mavericks.* tag: VER = the tag (must match the committed VERSION file); publish=yes.
      #   - workflow_dispatch(local_release=true): VER = <same date>-mavericks.(N+1) where N is the
      #     highest EXISTING tag for this date — derived from tags, not from the VERSION file, because a
      #     dispatch-cut version is never committed back: reading the file would recompute the same N+1
      #     on the next ingredient bump and OVERWRITE that release instead of cutting the next one.
      #     publish=yes. Written to the local VERSION file (NOT committed) so this job's own cmake
      #     configure (MAVERICKS_DOCKER_VERSION, the updater's bundle version) embeds the repackage's
      #     real version, not the stale on-disk one.
      #   - anything else (push to main / PR): VER = the committed VERSION file, unchanged; publish=no.
      - name: Decide version + whether this run publishes
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"
            FILEVER=$(cat VERSION)
            if [ "$VER" != "$FILEVER" ]; then
              echo "::error::tag $VER != VERSION file $FILEVER"; exit 1; fi
            PUBLISH=true
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ github.event.inputs.local_release }}" = "true" ]; then
            CUR=$(cat VERSION)
            UP="${CUR%%-mavericks.*}"; N="${CUR##*-mavericks.}"
            case "$N" in ''|*[!0-9]*) echo "::error::unexpected VERSION '$CUR'"; exit 1;; esac
            for t in $(git tag --list "${UP}-mavericks.*"); do
              n="${t##*-mavericks.}"
              case "$n" in ''|*[!0-9]*) continue;; esac
              [ "$n" -gt "$N" ] && N="$n"
            done
            VER="${UP}-mavericks.$((N + 1))"
            PUBLISH=true
            printf '%s\n' "$VER" > VERSION
          else
            VER=$(cat VERSION)
            PUBLISH=false
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      # The 10.9-correct Go toolchain (patched mavericks-golang cross .pkg; see the comment history).
      - name: Install patched Go (mavericks-golang cross toolchain)
        run: |
          # Renovate bumps components/golang/version via the '# mavericks-golang' customManager in
          # .github/renovate.json (github-releases on ModernMavericks/golang). No pinned sha256 to
          # hand-maintain: we verify the download against golang's own published SHA256SUMS for the
          # pinned release.
          ver="$(cat components/golang/version)"
          base="https://github.com/ModernMavericks/golang/releases/download/${ver}"
          curl -fL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          # golang renamed its cross asset prefix go126- -> golang- at 1.26.5-mavericks.1; accept either.
          gover="${ver%%-mavericks.*}"; rev="${ver#*-}"; pkg=""; sum=""
          for pref in golang go126; do
            cand="${pref}-${gover}-cross-${rev}.pkg"
            s=$(awk -v f="$cand" '$2==f' SHA256SUMS || true)
            if [ -n "$s" ]; then pkg="$cand"; sum="$s"; break; fi
          done
          [ -n "$pkg" ] || { echo "::error::no cross pkg for $ver in golang SHA256SUMS"; exit 1; }
          curl -fL --retry 3 -o "$pkg" "$base/$pkg"
          printf '%s\n' "$sum" | shasum -a 256 -c -
          sudo installer -pkg "$pkg" -target /
          echo "/usr/local/go126-cross/bin" >> "$GITHUB_PATH"

      - name: Confirm the patched cross toolchain is on PATH
        run: |
          test "$(command -v go)" = /usr/local/go126-cross/bin/go
          go version

      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sdk-cache
          key: macosx10.9-sdk-v1   # the SDK is pinned inside fetch_sdk.sh; key is stable across shared-cmake bumps

      - name: Build + gate (the SAME cmake build the Tahoe dry run runs)
        env:
          MAVERICKS_SDK_CACHE: ${{ github.workspace }}/.sdk-cache
        run: |
          cmake --preset cross
          cmake --build --preset cross
          ctest --preset cross

      # Build the Sparkle updater .app on every build (catches updater breaks on PRs). The updater must
      # NOT link any docker product (self-update circularity); its own binary is named
      # ContainerToolsUpdater, so skip line 1 of otool before checking for a docker linkage.
      - name: Build the Sparkle updater (must not link docker)
        run: |
          # The x86_64 Sparkle slice is auto-derived from the updater's CMAKE_OSX_ARCHITECTURES.
          cmake -S updater -B build/updater -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          cmake --build build/updater
          BIN=build/updater/ContainerToolsUpdater.app/Contents/MacOS/ContainerToolsUpdater
          otool -L "$BIN" | tee /tmp/o.txt
          if otool -L "$BIN" | tail -n +2 | grep -iq docker; then
            echo "::error::updater links a docker product (self-update circularity)"; exit 1; fi

      - name: Build the menu-bar app
        run: |
          cmake -S menubar -B build/menubar -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          cmake --build build/menubar

      # On tags: bundle the packaging inputs into ONE tarball so executable bits (binaries, the .app's
      # Mach-Os, the signer) survive the artifact round-trip -- artifacts otherwise drop file modes.
      - name: Stage + upload packaging inputs
        if: steps.ver.outputs.publish == 'true'
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p stage
          cp build-cross/docker-cli/docker            stage/docker
          cp build-cross/docker-compose/docker-compose stage/docker-compose
          cp build-cross/docker-machine/docker-machine stage/docker-machine
          cp build-cross/lazydocker/lazydocker        stage/lazydocker
          cp -R build/updater/ContainerToolsUpdater.app stage/ContainerToolsUpdater.app
          cp -R build/menubar/DockerMenu.app stage/DockerMenu.app
          find stage -name '._*' -delete 2>/dev/null || true
          tar -C stage -czf packaging-inputs.tgz .
      - name: Upload packaging inputs (publishing runs only)
        if: steps.ver.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packaging-inputs
          path: packaging-inputs.tgz

  # boot2docker.iso on native Linux/Docker (macos-26 can't build it). We only BUILD the iso here for
  # the .pkg. The iso reproducibility gates (iso_fetch_verify / iso_fingerprint) and the boot-proof are
  # owned by boot2docker.yml + the box -- running them here would duplicate that and couple the release
  # to boot2docker baseline maintenance. Acceptance for the shipped iso is the manual real-10.9 boot-test.
  # Gated the same way build-macos's "publish" decision is (tag, or workflow_dispatch local_release=
  # true) -- duplicated as a raw expression rather than a `needs: [build-macos]` edge, so this job
  # keeps running in parallel with build-macos instead of waiting on it.
  build-iso:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.event.inputs.local_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the boot2docker iso (same cmake iso build the box runs)
        run: |
          cmake --preset iso
          cmake --build --preset iso
      - uses: actions/upload-artifact@v7
        with:
          name: boot2docker-iso
          path: build-iso/boot2docker/boot2docker.iso

  # Assemble + sign the product .pkg and render the signed appcast. Needs the mac binaries/updater and
  # the iso; runs on macos-26 for pkgbuild/productbuild.
  package:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos, build-iso]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # generated notes diff ingredient pins against the previous release tag
      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: packaging-inputs, path: dl }
      - uses: actions/download-artifact@v8
        with: { name: boot2docker-iso, path: iso }

      # This job's checkout is fresh (a separate runner from build-macos), so it does NOT see the
      # VERSION mutation build-macos made locally for a local_release repackage. Use the authoritative
      # version build-macos decided (needs.build-macos.outputs.version), not `cat VERSION`. For the
      # same reason, release-notes/$VER.md for a freshly-cut local_release version can't exist in this
      # checkout yet (nothing was committed) -- stub it so sign_and_appcast.sh's --notes-file has a
      # non-empty file to read.
      # Then append the FACTS: which ingredient pins moved since the last release. A repackage exists
      # to ship a new input, so naming that input is the whole point of its notes -- but notes are
      # prose, so every step here tolerates failure rather than blocking a release.
      - name: Compose release notes (stub if absent, + which ingredients changed)
        env:
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          set -eu
          SCR="$(cat "$HOME/.cmake/packages/MavericksSharedCMake/"* | head -1)/scripts"
          NOTES="release-notes/$VER.md"
          if [ ! -s "$NOTES" ]; then
            mkdir -p release-notes
            {
              echo "ModernMavericks container-tools $VER."
              echo
              echo "- Repackage rebuilt with updated build ingredients. No change intended to the"
              echo "  docker component versions themselves beyond what is listed below."
              echo "- Automatically cut via workflow_dispatch local_release."
            } > "$NOTES"
          fi
          PREV="$(sh "$SCR/previous-release-tag.sh" "$VER" || true)"
          PINS="$(sh "$SCR/ingredient-pins.sh" || true)"
          if [ -n "$PREV" ] && [ -n "$PINS" ]; then
            SECTION="$(sh "$SCR/ingredient-notes.sh" "$PREV" $PINS || true)"
            [ -z "$SECTION" ] || printf '\n%s\n' "$SECTION" >> "$NOTES"
          fi
          mkdir -p dist
          cp "$NOTES" dist/RELEASE_NOTES.md   # becomes the Release body; not attached as an asset
          echo "=== $NOTES ==="; cat "$NOTES"

      - name: Assemble + sign the .pkg, render the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh` -> needs auth (else 403 rate-limit)
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          # Resolve the installed shared-cmake scripts dir via the CMake user package registry.
          SH="$(cat "$HOME/.cmake/packages/MavericksSharedCMake/"* | head -1)/scripts"
          [ -d "$SH" ] || { echo "::error::shared-cmake scripts not found at $SH"; exit 1; }
          mkdir -p in dist
          tar -C in -xzf dl/packaging-inputs.tgz      # restores executable bits
          PKG="dist/container-tools-$VER.pkg"

          MSC_SCRIPTS="$SH" sh cmake/package_pkg.sh --out "$PKG" --version "$VER" \
            --docker in/docker --compose in/docker-compose --machine in/docker-machine \
            --lazydocker in/lazydocker --iso iso/boot2docker.iso \
            --updater-app in/ContainerToolsUpdater.app \
            --docked payload/docked --sync-helper payload/container-tools-sync-image \
            --bootstrap payload/docker-machine-bootstrap \
            --common payload/docker-machine-common.sh \
            --ctl payload/docker-machine-ctl \
            --migrate payload/docker-machine-migrate \
            --menubar-app in/DockerMenu.app \
            --launch-agent payload/dev.modernmavericks.container-tools-machine.plist \
            --resources cmake/resources --welcome Welcome.html

          # Sign the .pkg + render the signed appcast; sign_and_appcast.sh auto-fetches the prebuilt
          # ed25519-sign. The enclosure points at the versioned release asset; the client feed is
          # /latest/ resolves to this full release immediately, so Sparkle clients pick it up right away.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "Container Tools for Mavericks" \
            --version "$VER" --pkg-url "$URL" --min-os 10.9.5 \
            --notes-file "release-notes/$VER.md" --pkg "$PKG" > dist/appcast.xml
          (cd dist && shasum -a 256 ./*.pkg > SHA256SUMS)
          echo "=== appcast.xml ==="; cat dist/appcast.xml
      - uses: actions/upload-artifact@v7
        with:
          name: docker-pkg
          path: |
            dist/*.pkg
            dist/appcast.xml
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md

  # All-or-nothing publish: the ONLY writer to Releases, gated on package. Ships a full release.
  # On a tag push the tag already exists; on workflow_dispatch local_release there is no tag at all
  # yet (a GITHUB_TOKEN-pushed tag wouldn't trigger anything anyway) -- explicit tag_name +
  # target_commitish tell action-gh-release to mint the -mavericks.(N+1) tag at this commit itself,
  # inline, in the same run that publishes it. No second-hop, no push required.
  publish:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-macos.outputs.version }}
          target_commitish: ${{ github.sha }}
          # Same file the appcast used, so the Release page and Sparkle tell the same story. Not in
          # `files:` below, so it is the body and not an attached asset.
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.pkg
            dist/appcast.xml
            dist/SHA256SUMS
